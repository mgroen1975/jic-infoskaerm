<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Jetsmark Idrætscenter – Dagen i dag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <main class="screen">
    <header class="hero">
      <div>
        <p class="today-date" id="today-date">Henter dagens dato…</p>
      </div>
      <time id="header-clock" class="header-clock" aria-label="Aktuelt klokkeslæt og ugenummer">--:--:--</time>
      <div class="live-pill"><i></i><span>LIVE FRA CONVENTUS</span></div>
    </header>

    <section class="panel">
      <div class="panel-title">Dagens bookinger</div>
      <div class="column-head" aria-hidden="true">
        <span>Tid</span><span>Aktivitet / info</span><span>Ressource</span>
      </div>
      <div class="today-output" id="today-bookings">
        <script type="text/javascript" src="https://www.conventus.dk/dataudv/www/booking_v2_liste.php?forening=2944&vis=1&ressourcer=5394;5395;41893;41892;41895;41896;43929;43931;26597;40665;5396;22230;47117&kategorier=&kun_egne=false&skyggebookinger=false&gruppeAfd=&layout=relativ&columns=skygge;dato;tid;titel;info;kategori;ressource;book&heads=day"></script>
      </div>
    </section>
  </main>
</div>
<script>
(function(){
  var clock=document.getElementById('header-clock');
  if(!clock)return;
  var formatter=new Intl.DateTimeFormat('da-DK',{timeZone:'Europe/Copenhagen',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
  var dateFormatter=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Copenhagen',year:'numeric',month:'2-digit',day:'2-digit'});
  function isoWeek(now){
    var parts=dateFormatter.formatToParts(now),p={};
    parts.forEach(function(x){p[x.type]=x.value;});
    var d=new Date(Date.UTC(+p.year,+p.month-1,+p.day));
    d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));
    var yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));
    return Math.ceil((((d-yearStart)/86400000)+1)/7);
  }
  function update(){var now=new Date();clock.textContent=formatter.format(now)+' · Uge '+isoWeek(now);}
  update();
  setInterval(update,1000);
})();
</script>
<script src="app.js"></script>
</body>
</html>
