<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jetsmark Idrætscenter – Infoskærm</title>
<style>
:root{
  --navy:#0d2f4f;
  --blue:#1d83c6;
  --light:#eef7fd;
  --line:#d8e7f1;
  --muted:#61788a;
  --green:#14784c;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#dfeaf2;
  color:var(--navy);
}
body{display:grid;place-items:center}
.screen{
  width:min(100vw,calc(100vh * 9 / 16));
  height:min(100vh,calc(100vw * 16 / 9));
  aspect-ratio:9/16;
  background:linear-gradient(180deg,#f8fcff 0%,#edf7fd 48%,#f8fcff 100%);
  display:grid;
  grid-template-rows:1fr 1fr;
  overflow:hidden;
}
.half{
  min-height:0;
  padding:2.4% 3.2%;
  display:grid;
  grid-template-rows:auto 1fr;
  gap:1.5%;
}
.half + .half{
  border-top:2px solid #d4e6f1;
}
.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:1rem;
}
.eyebrow{
  margin:0 0 .25em;
  color:var(--blue);
  font-size:clamp(9px,1.05vw,18px);
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}
h1,h2{margin:0;letter-spacing:-.035em}
h1{font-size:clamp(28px,4.1vw,70px);line-height:.95}
h2{font-size:clamp(26px,3.7vw,62px);line-height:.95}
.subline{
  margin:.45em 0 0;
  color:var(--muted);
  font-size:clamp(9px,1.15vw,20px);
  font-weight:600;
}
.badge{
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  padding:.62em 1em;
  font-size:clamp(9px,1.1vw,19px);
  font-weight:800;
  box-shadow:0 8px 24px rgba(13,47,79,.08);
  white-space:nowrap;
}
.badge.live{
  color:var(--green);
  background:#e8f8ef;
  border-color:#d4efdf;
}
.panel{
  min-height:0;
  background:#fff;
  border:1px solid rgba(13,47,79,.08);
  border-radius:26px;
  box-shadow:0 12px 34px rgba(13,47,79,.10);
  overflow:hidden;
}
.panel-title{
  padding:1.25% 2%;
  background:linear-gradient(90deg,#e5f5ff,#f8fcff);
  border-bottom:1px solid var(--line);
  font-size:clamp(10px,1.2vw,21px);
  font-weight:800;
  color:#37566d;
}
.conventus-output{
  height:calc(100% - 3.4em);
  padding:1% 1.5% 1.5%;
  overflow:hidden;
}

/* Tilpas Conventus-visningen til infoskærmen */
.conventus-output,
.conventus-output *{
  font-family:Arial,Helvetica,sans-serif !important;
  box-sizing:border-box !important;
}
.conventus-output table{
  width:100% !important;
  max-width:100% !important;
  border-collapse:separate !important;
  border-spacing:0 4px !important;
  background:transparent !important;
  border:0 !important;
}
.conventus-output thead,
.conventus-output th{background:transparent !important}
.conventus-output th{
  padding:7px 9px !important;
  color:#607689 !important;
  font-size:clamp(8px,.92vw,16px) !important;
  text-align:left !important;
  border:0 !important;
}
.conventus-output td{
  padding:8px 9px !important;
  font-size:clamp(8px,.95vw,17px) !important;
  line-height:1.15 !important;
  border-top:1px solid #e3edf4 !important;
  border-bottom:1px solid #e3edf4 !important;
  background:#f8fbfd !important;
  color:#15344f !important;
  vertical-align:top !important;
}
.conventus-output tr td:first-child{
  border-left:1px solid #e3edf4 !important;
  border-radius:9px 0 0 9px !important;
}
.conventus-output tr td:last-child{
  border-right:1px solid #e3edf4 !important;
  border-radius:0 9px 9px 0 !important;
}
.conventus-output a{
  color:var(--blue) !important;
  text-decoration:none !important;
  font-weight:700 !important;
}
.conventus-output img{max-height:22px !important;width:auto !important}
.conventus-output input,
.conventus-output select,
.conventus-output button{
  border:1px solid #cfe0eb !important;
  border-radius:8px !important;
  padding:5px 8px !important;
  background:#fff !important;
}
.conventus-output h1,
.conventus-output h2,
.conventus-output h3{
  color:var(--navy) !important;
  margin:.3em 0 !important;
}
.conventus-output .overskrift,
.conventus-output .header,
.conventus-output .head{
  color:var(--navy) !important;
  background:#eef7fd !important;
}

@media (max-width:650px){
  .panel{border-radius:16px}
  .badge{padding:.45em .7em}
  .half{padding:2.2% 2.5%}
}
</style>
</head>
<body>
<main class="screen">
  <section class="half week-half">
    <div class="section-head">
      <div>
        <p class="eyebrow">Jetsmark Idrætscenter</p>
        <h1>Denne uge · <span id="week-number">Uge 44</span></h1>
        <p class="subline" id="week-note">Ugens bookinger fra Conventus</p>
      </div>
      <div class="badge">7 DAGE</div>
    </div>

    <div class="panel">
      <div class="panel-title">Ugeoversigt</div>
      <div class="conventus-output" id="week-bookings">
        <script type="text/javascript" src="https://www.conventus.dk/dataudv/www/booking_v2_liste.php?forening=2944&vis=7&ressourcer=5394;5395;41893;41892;41895;41896;43929;43931;26597;40665;5396;22230;47117&kategorier=&kun_egne=false&skyggebookinger=true&gruppeAfd=&layout=relativ&columns=skygge;dato;tid;titel;info;kategori;ressource;book&heads=day"></script>
      </div>
    </div>
  </section>

  <section class="half today-half">
    <div class="section-head">
      <div>
        <p class="eyebrow">Aktuelle bookinger</p>
        <h2>Dagen i dag</h2>
        <p class="subline" id="today-date">Henter dagens dato…</p>
      </div>
      <div class="badge live">● LIVE FRA CONVENTUS</div>
    </div>

    <div class="panel">
      <div class="panel-title">Dagens bookinger</div>
      <div class="conventus-output" id="today-bookings">
        <script type="text/javascript" src="https://www.conventus.dk/dataudv/www/booking_v2_liste.php?forening=2944&vis=1&ressourcer=5394;5395;41893;41892;41895;41896;43929;43931;26597;40665;5396;22230;47117&kategorier=&kun_egne=false&skyggebookinger=true&gruppeAfd=&layout=relativ&columns=skygge;dato;tid;titel;info;kategori;ressource;book&heads=day"></script>
      </div>
    </div>
  </section>
</main>

<script>
(function(){
  const TZ = 'Europe/Copenhagen';

  function copenhagenParts(){
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: TZ,
      year:'numeric', month:'2-digit', day:'2-digit',
      hour:'2-digit', minute:'2-digit', second:'2-digit',
      hourCycle:'h23', weekday:'short'
    }).formatToParts(new Date());
    const out = {};
    for (const p of parts) out[p.type] = p.value;
    return out;
  }

  function isoWeekForDate(year, month, day){
    const d = new Date(Date.UTC(year, month - 1, day));
    const weekday = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - weekday);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  }

  function displayWeek(){
    const p = copenhagenParts();
    let y = Number(p.year), m = Number(p.month), d = Number(p.day);

    // Efter brugerens ønske skifter ugevisningen søndag kl. 00:01 dansk tid.
    const isSunday = p.weekday === 'Sun';
    const afterBoundary = Number(p.hour) > 0 || Number(p.minute) >= 1;
    if (isSunday && afterBoundary){
      const next = new Date(Date.UTC(y, m - 1, d + 1));
      y = next.getUTCFullYear();
      m = next.getUTCMonth() + 1;
      d = next.getUTCDate();
    }
    return isoWeekForDate(y,m,d);
  }

  function updateLabels(){
    document.getElementById('week-number').textContent = 'Uge ' + displayWeek();

    const now = new Date();
    const today = new Intl.DateTimeFormat('da-DK', {
      timeZone: TZ,
      weekday:'long', day:'numeric', month:'long', year:'numeric'
    }).format(now);
    document.getElementById('today-date').textContent = today.charAt(0).toUpperCase() + today.slice(1);
  }

  updateLabels();
  setInterval(updateLabels, 30000);

  // Henter friske Conventus-data automatisk på en infoskærm, der står tændt hele dagen.
  setTimeout(function(){ location.reload(); }, 5 * 60 * 1000);
})();
</script>
</body>
</html>
