:root{--navy:#6F2911;--blue:#8D3717;--line:#eddbd4;--ink:#45251b;--muted:#806b64}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Arial,Helvetica,sans-serif;color:var(--ink);background:#f8f1ed}
#stage{width:100%;height:100%;display:flex;flex-direction:column;padding:2.2vh 2.5vw 1.4vh;gap:1.4vh}
header{display:flex;align-items:center;justify-content:space-between;gap:3vw;background:#fff;border-radius:1vw;padding:1.6vh 2.2vw;box-shadow:0 8px 35px #6f29110c;min-height:12vh}
.brand{display:flex;align-items:center;gap:1.1vw}.mark{height:4.4vw;width:4.4vw;max-height:96px;max-width:96px;border-radius:1vw;background:linear-gradient(145deg,#C87959,#8D3717);color:#fff;display:grid;place-items:center;font-weight:900;font-size:clamp(30px,2.65vw,100px);letter-spacing:-.22em;padding-right:.25em}
.brand-title{font-size:clamp(22px,2.25vw,92px);font-weight:850;letter-spacing:-.035em;line-height:1}.brand-sub{font-size:clamp(11px,.86vw,32px);letter-spacing:.21em;color:#8e756a;font-weight:750;margin-top:.7vh}
.datebox{text-align:right}.weekday{font-weight:850;font-size:clamp(24px,2vw,80px);text-transform:capitalize}.date{font-size:clamp(16px,1.15vw,44px);color:var(--muted);margin-top:.5vh}
main{display:flex;flex-direction:column;flex:1;min-height:0;background:#fff;border-radius:1vw;overflow:hidden;box-shadow:0 8px 35px #6f291110}

.heading h1{font-size:clamp(25px,2.15vw,80px);margin:0;font-weight:800;letter-spacing:-.025em}.live{font-size:clamp(12px,.85vw,34px);font-weight:750;letter-spacing:.11em;opacity:.9}.live:before{content:"";display:inline-block;width:.65em;height:.65em;background:#f3ce95;border-radius:50%;margin-right:.7em}
.colheads{display:grid;grid-template-columns:18% 57% 25%;padding:1.1vh 2vw;background:#f2dfd6;color:#795343;font-size:clamp(14px,1vw,42px);font-weight:800;text-transform:uppercase;letter-spacing:.09em}

.booking{display:grid;grid-template-columns:18% 57% 25%;align-items:center;min-height:0;height:100%;padding:0 2vw;border-bottom:1px solid var(--line);gap:0;overflow:hidden}
.booking:nth-child(even){background:#fbf6f3}.booking:last-child{border:0}
.time{display:flex;align-items:center;height:100%;line-height:1.1;font-size:clamp(20px,1.75vw,70px);font-weight:850;color:#8D3717;white-space:nowrap;letter-spacing:-.025em}

.resources{display:flex;align-items:center;align-self:center;gap:.4vw;flex-wrap:wrap;padding-left:.8vw}.resource{font-size:clamp(13px,1.03vw,42px);font-weight:750;background:#f4e5dd;color:#6F2911;padding:.55vh .65vw;border-radius:.35vw;line-height:1.15}
.empty{display:grid;place-items:center;flex:1;color:#806b64;font-size:clamp(18px,1.7vw,64px);padding:2vw;text-align:center}

#source{position:absolute;left:-99999px;top:0;opacity:0;pointer-events:none}

<script>

const TZ='Europe/Copenhagen', list=document.getElementById('list');

document.getElementById('date').textContent=fmt.slice(fmt.indexOf(' ')+1);
function norm(s){return String(s||'').replace(/\s+/g,' ').trim();}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

const tables=document.querySelectorAll('#source table');if(!tables.length)return null;
const output=[],keys=new Map();
tables.forEach(table=>{const h=mapping(table);table.querySelectorAll('tr').forEach(tr=>{
if(tr.querySelector('th'))return;const cells=[...tr.cells],vals=cells.map(c=>norm(c.textContent));if(cells.length<2||!isToday(tr.textContent))return;
const ix=h.time??vals.findIndex(s=>/\d{1,2}[:.]\d{2}/.test(s));if(ix<0)return;
const t=time(vals[ix]),title=vals[h.title??(ix+1)];if(!t||!title)return;
const res=vals[h.resource??(ix+4)]||'';
const key=(t+'|'+title).toLowerCase();let item=keys.get(key);
if(!item){item={t,title,resources:[]};keys.set(key,item);output.push(item);}
let resource=norm(res);
if(/Karlsvognen/i.test(resource)&&/(Gamma|Zeta)/i.test(tr.textContent))resource=resource.replace(/Mødelokale\s+Karlsvognen|Karlsvognen/ig,'').trim();
if(resource&&!item.resources.includes(resource))item.resources.push(resource);
});});
output.sort((a,b)=>a.t.localeCompare(b.t,'da'));return output;
}
function render(){
const data=read();if(!data)return false;
if(!data.length){list.innerHTML='<div class="empty">Ingen aktiviteter registreret i dag</div>';return true;}
list.innerHTML=data.map(x=>'<div class="booking"><div class="time">'+esc(x.t)+'</div><div class="activity">'+esc(x.title)+'</div><div class="resources">'+(x.resources.length?x.resources.map(r=>'<span class="resource">'+esc(r)+'</span>').join(''):'<span class="resource">—</span>')+'</div></div>').join('');
list.style.setProperty('--rows',String(data.length));list.classList.toggle('dense',data.length>8);list.classList.toggle('very-dense',data.length>17);return true;
}
let count=0;const poll=setInterval(()=>{count++;if(render()||count>=100){clearInterval(poll);if(count>=100&&list.textContent.includes('Henter'))list.innerHTML='<div class="empty">Kunne ikke hente dagens aktiviteter. Skærmen forsøger igen automatisk.</div>';}},300);
})();
</script>
</body>
</html>
